  code: '3'
  name: Business Decision-Making
  durationMinutes: 105
  rawMarks: 60
  weightOfQualification: 0.3
  stage: a2
  sections:
  - code: A
    name: Case study and data
    marks: 60
    description: Decision-focused questions on a case study with quantitative data.
  materials:
  - Case study insert
  - Calculator
  notes: Carries the highest AO4 weighting of the AS papers plus quantitative demand.
