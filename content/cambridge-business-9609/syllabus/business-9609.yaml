  code: '2'
  name: Business Concepts 2
  durationMinutes: 90
  rawMarks: 60
  weightOfQualification: 0.3
  stage: as
  sections:
  - code: A
    name: Data response
    marks: 60
    questionCount: 2
    description: Two compulsory data-response questions on a case-study insert.
  materials:
  - Case study insert
  notes: 60% of the AS Level. 1.5 minutes per mark — the tightest paper in the qualification.
