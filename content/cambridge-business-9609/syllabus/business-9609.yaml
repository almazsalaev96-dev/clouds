  code: '4'
  name: Business Strategy
  durationMinutes: 75
  rawMarks: 40
  weightOfQualification: 0.2
  stage: a2
  sections:
  - code: A
    name: Essays
    marks: 40
    questionCount: 2
    description: Two compulsory 20-mark essays on a case study.
  materials:
  - Case study insert
  notes: 75% of this paper is AO3+AO4. Two well-built essays are worth 30 skill marks — the densest A*
    lever in the qualification.
assessmentObjectives:
- id: ao1
  code: AO1
  name: Knowledge and understanding
  description: Demonstrate knowledge and understanding of business concepts, terms and theories.
  weightByPaper:
    9609-p1: 0.35
    9609-p2: 0.3
    9609-p3: 0.2
    9609-p4: 0.15
- id: ao2
  code: AO2
  name: Application
  description: Apply knowledge and understanding of business concepts, terms and theories to problems
    and issues in a range of familiar and unfamiliar business situations and contexts.
  weightByPaper:
    9609-p1: 0.3
    9609-p2: 0.3
    9609-p3: 0.27
    9609-p4: 0.1
- id: ao3
  code: AO3
  name: Analysis
  description: Analyse business problems, issues and situations using appropriate methods; work with quantitative
    and qualitative information; find causes, impacts and consequences; distinguish between fact and opinion;
    draw valid inferences.
  weightByPaper:
    9609-p1: 0.2
    9609-p2: 0.2
    9609-p3: 0.23
    9609-p4: 0.4
- id: ao4
  code: AO4
  name: Evaluation
  description: Evaluate evidence in order to make reasoned judgements, present substantiated conclusions
    and, where appropriate, recommend courses of action.
  weightByPaper:
    9609-p1: 0.15
    9609-p2: 0.2
    9609-p3: 0.3
    9609-p4: 0.35
