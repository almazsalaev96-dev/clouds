skills:
- id: sk-chain
  name: Causal chain
  aoCode: AO3
  description: 'Developing a point into a consequence for this specific business: cause → mechanism →
    effect → consequence here.'
  drill: Take any concept and write a three-link chain into a given context. Twenty a week, five minutes
    each.
- id: sk-application
  name: Contextual application
  aoCode: AO2
  description: 'Using something only true of this business: a figure, a market condition, a stated objective,
    a constraint.'
  drill: Cover the business name in your sentence. If it still works for any company, rewrite it.
- id: sk-judgement
  name: Substantiated judgement
  aoCode: AO4
  description: Committing to an answer, saying why that factor outweighed the others, and attaching a
    condition from the case.
  drill: Write conclusions only — ten of them, no essays — using the four-sentence template.
- id: sk-quality-evidence
  name: Evaluating evidence quality
  aoCode: AO4
  description: Questioning sample size, age of data, opinion presented as fact, and forecast assumptions.
  drill: For every number in a case study, write one sentence on why it might mislead.
- id: sk-calculation
  name: Calculation and interpretation
  aoCode: AO2
  description: Selecting the formula, substituting correctly, stating units, and writing one sentence
    on what the number means.
  drill: Every formula in the toolkit to blank recall, including the interpreting sentence.
- id: sk-structure
  name: Answer structure
  aoCode: AO3
  description: One developed point per paragraph, so a marker can find every mark you earned.
  drill: Rewrite a wall-of-text answer as separate paragraphs and count how many points become visible.
