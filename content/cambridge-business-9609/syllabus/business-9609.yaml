commandWords:
- word: Define
  definition: Give the precise meaning of a term.
  aoCeiling:
  - AO1
  expects: One accurate sentence. Nothing else is creditable, and explanation here spends time you need
    elsewhere.
  answerStructure:
  - A single precise sentence carrying the defining feature.
  weakExample: Cash flow is money in a business.
  strongExample: Cash flow is the movement of cash into and out of a business over a period of time.
  trap: Padding a definition with examples and explanation that earn nothing.
- word: State
  definition: Give a fact, a name or a short answer without explanation.
  aoCeiling:
  - AO1
  expects: The fact alone. No development required or rewarded.
  answerStructure:
  - The fact, in as few words as are accurate.
  trap: Writing a paragraph where a phrase was asked for.
- word: Identify
  definition: Name or select something.
  aoCeiling:
  - AO1
  expects: The item named. Where a number is asked for, give exactly that many.
  answerStructure:
  - The named item or items.
  trap: Giving four when two were asked for; only the first are usually marked.
- word: Outline
  definition: Set out the main points.
  aoCeiling:
  - AO1
  - AO2
  expects: The main points briefly, without development into consequences.
  answerStructure:
  - Point one, in a sentence.
  - Point two, in a sentence.
  trap: Turning an outline into an essay.
- word: Describe
  definition: State the features of something.
  aoCeiling:
  - AO1
  - AO2
  expects: Features stated clearly, applied to the context where one is given.
  answerStructure:
  - Feature.
  - How it appears in this business.
  trap: Describing where the question actually asked you to explain why.
- word: Explain
  definition: Set out the purposes or reasons, making the relationships between things clear.
  aoCeiling:
  - AO1
  - AO2
  expects: Definition plus how it applies here, with the reason made explicit. No judgement needed.
  answerStructure:
  - What it is.
  - How it works.
  - Why that matters in this specific business.
  weakExample: Delegation improves motivation.
  strongExample: Delegating stock ordering gives branch managers control over a decision that visibly
    affects their branch's results, which meets the esteem needs above security in Maslow's hierarchy
    — and since this firm's 34% turnover is concentrated in supervisory grades, retaining those managers
    directly reduces its stated $18,000 recruitment cost.
  trap: Stating a point and stopping, so no reason is ever given.
- word: Calculate
  definition: Work out a numerical answer, showing the steps.
  aoCeiling:
  - AO1
  - AO2
  expects: Working shown, the correct figure, the unit stated, and one sentence saying what it means.
  answerStructure:
  - Formula.
  - Substitution.
  - Answer with unit.
  - One sentence of interpretation.
  trap: Inverting the formula, forgetting to multiply by 100, confusing mark-up with margin, or omitting
    the unit.
- word: Analyse
  definition: Examine in detail to show meaning and identify elements and relationships.
  aoCeiling:
  - AO1
  - AO2
  - AO3
  expects: 'Developed chains: cause, mechanism, effect, and consequence for this business. There are no
    evaluation marks available.'
  answerStructure:
  - Point.
  - Which means…
  - So…
  - Consequence for this specific business.
  trap: Writing evaluation into an Analyse question. There are no AO4 marks to earn, so the judgement
    earns nothing and costs real minutes.
- word: Compare
  definition: Identify similarities and differences.
  aoCeiling:
  - AO1
  - AO2
  - AO3
  expects: Explicit comparison in the same sentence, not two separate descriptions.
  answerStructure:
  - Whereas X does A, Y does B, which means…
  trap: Describing both things separately and leaving the comparison to the marker.
- word: Contrast
  definition: Identify and set out the differences.
  aoCeiling:
  - AO1
  - AO2
  - AO3
  expects: Differences made explicit, with the significance of each.
  answerStructure:
  - Difference.
  - Why that difference matters here.
  trap: Listing differences with no consequence attached.
- word: Discuss
  definition: Write about an issue in depth, considering different points of view.
  aoCeiling:
  - AO1
  - AO2
  - AO3
  - AO4
  expects: Both sides developed, then a judgement between them.
  answerStructure:
  - The case for.
  - The case against.
  - Which is stronger here, and why.
  trap: Balanced coverage with no judgement at the end — the AO4 marks stay unearned.
- word: Evaluate
  definition: Judge or calculate the quality, importance or condition of something.
  aoCeiling:
  - AO1
  - AO2
  - AO3
  - AO4
  expects: Judgement dominant. Front-load it rather than saving it for a final sentence.
  answerStructure:
  - The judgement, stated early.
  - Why this factor outweighs the others.
  - The condition under which it would change.
  weakExample: In conclusion, it depends on the situation.
  strongExample: On balance the firm should delay the expansion, because its gearing of 68% leaves no
    capacity to absorb a further downturn — which outweighs the first-mover advantage, given that the
    case's own forecast rests on a 4% growth assumption that has already been missed twice.
  trap: A summary instead of a judgement. Restating your paragraphs is not evaluation.
- word: Assess
  definition: Make an informed judgement.
  aoCeiling:
  - AO1
  - AO2
  - AO3
  - AO4
  expects: Weighing of factors leading to a clear position, with the reasoning visible.
  answerStructure:
  - Factors weighed against each other.
  - Which matters most here, and why.
  trap: Assessing everything equally, so nothing is actually judged.
- word: Justify
  definition: Support a case with evidence and argument.
  aoCeiling:
  - AO1
  - AO2
  - AO3
  - AO4
  expects: A position plus the evidence that supports it, and why the counter-argument is weaker.
  answerStructure:
  - The position.
  - Evidence from the case.
  - Why the alternative is weaker.
  trap: Asserting a position with no evidence attached.
- word: Recommend
  definition: Suggest a course of action, with reasons.
  aoCeiling:
  - AO1
  - AO2
  - AO3
  - AO4
  expects: A specific action, justified, ideally with timing and a condition.
  answerStructure:
  - What to do.
  - Why, given this business's circumstances.
  - When, and what would change the advice.
  trap: Ending with 'it depends' instead of committing to a course of action.
- word: Advise
  definition: Write about the issues and give a recommended course of action.
  aoCeiling:
  - AO1
  - AO2
  - AO3
  - AO4
  expects: Issues covered, then a clear recommendation the client could act on.
  answerStructure:
  - The issues.
  - The recommendation.
  - The condition attached to it.
  trap: Advice that is not actionable.
- word: Suggest
  definition: Apply knowledge and understanding to a situation where there are a range of valid responses.
  aoCeiling:
  - AO1
  - AO2
  - AO3
  expects: A plausible response tied to this context, with a reason.
  answerStructure:
  - The suggestion.
  - Why it fits this business specifically.
  trap: A generic suggestion that would fit any firm.
- word: Predict
  definition: Suggest what may happen based on available information.
  aoCeiling:
  - AO1
  - AO2
  - AO3
  expects: A stated outcome with the reasoning that leads to it.
  answerStructure:
  - The predicted outcome.
  - The mechanism that produces it.
  trap: A prediction with no mechanism behind it.
- word: Consider
  definition: Review and respond to given information.
  aoCeiling:
  - AO1
  - AO2
  - AO3
  expects: Engagement with the specific information supplied, not with the topic in general.
  answerStructure:
  - What the information shows.
  - What follows from it here.
  trap: Ignoring the data supplied and writing from memory.
- word: Summarise
  definition: Select and present the main points, without detail.
  aoCeiling:
  - AO1
  - AO2
  expects: The main points only, compressed.
  answerStructure:
  - Main point, one line each.
  trap: Reproducing the source at length instead of compressing it.
gradeThresholds: []
