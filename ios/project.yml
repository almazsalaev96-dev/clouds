# XcodeGen spec. `brew install xcodegen && xcodegen generate` produces Slate.xcodeproj.
#
# The project file is generated rather than committed: a .pbxproj is unreviewable in a
# diff, and every merge conflict in one is resolved by guessing.
name: Slate
options:
  bundleIdPrefix: com.slate
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "5.9"
    SWIFT_STRICT_CONCURRENCY: complete
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    DEAD_CODE_STRIPPING: YES
    GCC_TREAT_WARNINGS_AS_ERRORS: YES
    SWIFT_TREAT_WARNINGS_AS_ERRORS: NO

packages:
  SlateKit:
    path: Packages/SlateKit

targets:
  Slate:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Slate
    dependencies:
      - package: SlateKit
        products:
          - SlateFoundation
          - SlateModel
          - SlateLearning
          - SlateDocuments
          - SlateInk
          - SlateAI
          - SlateVoice
          - SlateDesign
          - SlateUI
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.slate.studyos
        INFOPLIST_FILE: Slate/Info.plist
        TARGETED_DEVICE_FAMILY: "2"       # iPad only: this is a Pencil-first product
        SUPPORTS_MAC_CATALYST: NO
        CODE_SIGN_ENTITLEMENTS: Slate/Slate.entitlements
